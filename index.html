<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junction Darts Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Aurora Borealis 3D Canvas */
        #aurora-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1, h2, h3, h4 {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header {
            text-align: center;
            padding: 10px 0 8px;
        }

        .header-logo {
            height: 30px;
            margin-bottom: 4px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #a0d8ef 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 4px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        .golden-ticket {
            margin-top: 8px;
            padding: 8px 20px;
            background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(180,140,20,0.06));
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-block;
            background-clip: padding-box;
            position: relative;
            /* 3D metallic gold text */
            color: transparent;
            background-image: linear-gradient(
                180deg,
                #bf953f 0%,
                #fcf6ba 25%,
                #e8d168 35%,
                #bf953f 50%,
                #fcf6ba 65%,
                #e8d168 75%,
                #bf953f 100%
            );
            background-size: 100% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 8s ease-in-out infinite;
            /* 3D depth via text-shadow on a pseudo-element */
            filter: drop-shadow(0 1px 1px rgba(180,140,20,0.6)) drop-shadow(0 2px 3px rgba(0,0,0,0.4));
            text-shadow: none;
        }

        @keyframes goldShine {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 0% 100%; }
        }

        .golden-ticket .silver-text {
            background-image: linear-gradient(
                180deg,
                #8e8e8e 0%,
                #e8e8e8 25%,
                #c0c0c0 35%,
                #8e8e8e 50%,
                #e8e8e8 65%,
                #c0c0c0 75%,
                #8e8e8e 100%
            );
            background-size: 100% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 8s ease-in-out infinite;
        }

        .golden-ticket::before {
            content: 'Win a Golden Ticket to Junction 2026 Main Event';
            position: absolute;
            top: 8px;
            left: 20px;
            right: 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(120,90,20,0.5);
            z-index: -1;
            transform: translate(0px, 1.5px);
            -webkit-text-fill-color: rgba(120,90,20,0.5);
        }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.9);
        }

        /* Name Input Screen */
        #screen-entry .name-input-group {
            display: flex;
            gap: 12px;
        }

        #screen-entry input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #screen-entry input:focus {
            border-color: rgba(255,255,255,0.4);
        }

        #screen-entry input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #fff;
            color: #000;
        }

        .btn-primary:hover {
            background: rgba(255,255,255,0.85);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(255,80,80,0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255,80,80,0.3);
        }

        .btn-danger:hover {
            background: rgba(255,80,80,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.75rem;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Scoring Screen */
        #screen-scoring {
            display: none;
        }

        .player-banner {
            text-align: center;
            margin-bottom: 6px;
        }

        .player-banner h2 {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        .player-banner .dart-count {
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
        }

        .current-score {
            text-align: center;
            font-size: 2.2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            margin: 4px 0 8px;
            color: #fff;
        }

        .darts-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .dart-slot {
            width: 80px;
            height: 46px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        .dart-slot .dart-label {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1px;
        }

        .dart-slot .dart-value {
            font-size: 1rem;
        }

        .dart-slot.active {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1);
        }

        .dart-slot.filled {
            border-color: rgba(160,216,239,0.4);
            background: rgba(160,216,239,0.08);
        }

        /* Score Input Sections */
        .score-section {
            margin-bottom: 6px;
        }

        .score-section h3 {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .score-grid {
            display: grid;
            gap: 4px;
        }

        .score-grid.numbers {
            grid-template-columns: repeat(10, 1fr);
        }

        .score-grid.multipliers {
            grid-template-columns: repeat(3, 1fr);
        }

        .score-grid.special {
            grid-template-columns: repeat(3, 1fr);
        }

        .score-btn {
            padding: 8px 2px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #fff;
            font-family: 'Lato', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }

        .score-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.25);
        }

        .score-btn.active {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.4);
        }

        .score-btn.multiplier {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .score-btn.multiplier.active {
            background: rgba(160,216,239,0.2);
            border-color: rgba(160,216,239,0.5);
            color: #a0d8ef;
        }

        .score-btn.special-btn {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .scoring-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .scoring-actions .btn {
            flex: 1;
        }

        .undo-submit-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .undo-submit-row .btn {
            flex: 1;
        }

        /* Manual score input */
        .manual-input-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            align-items: center;
        }

        .manual-input-row input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-family: 'Lato', sans-serif;
            font-size: 0.85rem;
            outline: none;
        }

        .manual-input-row input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .or-divider {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        /* Leaderboard */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-table th:last-child {
            text-align: right;
        }

        .leaderboard-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }

        .leaderboard-table td:last-child {
            text-align: right;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .leaderboard-table tr:first-child td {
            color: #ffd700;
        }

        .leaderboard-table tr:nth-child(2) td {
            color: #c0c0c0;
        }

        .leaderboard-table tr:nth-child(3) td {
            color: #cd7f32;
        }

        .rank {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            width: 40px;
        }

        .player-name-cell {
            display: flex;
            flex-direction: column;
        }

        .player-darts {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.35);
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.3);
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        /* History */
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-name {
            font-weight: 700;
        }

        .history-darts {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }

        .history-score {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .history-time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
        }

        /* Footer actions */
        .footer-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 20px 0 40px;
        }

        /* Miss button */
        .miss-btn {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.4);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: rgba(255,255,255,0.4);
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .tab.active {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .current-score {
                font-size: 2.8rem;
            }

            .score-grid.numbers {
                grid-template-columns: repeat(4, 1fr);
            }

            .dart-slot {
                width: 80px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <canvas id="aurora-canvas"></canvas>

    <div class="app-container">
        <div class="header">
            <img src="junction_logo.png" alt="Junction" class="header-logo" />
            <h1>Darts</h1>
            <div class="subtitle">Leaderboard</div>
            <div class="golden-ticket"><span class="silver-text">Win a </span>Golden Ticket<span class="silver-text"> to Junction 2026 Main Event</span></div>
        </div>

        <!-- Entry Screen -->
        <div id="screen-entry">
            <div class="card">
                <h2>Throw Your Darts</h2>
                <div class="name-input-group">
                    <input type="text" id="player-name" placeholder="Enter your name" autocomplete="off" />
                    <button class="btn btn-primary" id="btn-start" onclick="startTurn()">Start</button>
                </div>
            </div>

            <!-- Tabs for leaderboard/history -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('leaderboard')">Leaderboard</div>
                <div class="tab" onclick="switchTab('history')">Recent Throws</div>
            </div>

            <div id="tab-leaderboard" class="tab-content active">
                <div class="card">
                    <div id="leaderboard-content"></div>
                </div>
            </div>

            <div id="tab-history" class="tab-content">
                <div class="card">
                    <div id="history-content"></div>
                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-danger btn-small" onclick="clearData()">Reset All Data</button>
                <button class="btn btn-secondary btn-small" onclick="exportData()">Export Data</button>
            </div>
        </div>

        <!-- Scoring Screen -->
        <div id="screen-scoring">
            <div class="card">
                <div class="player-banner">
                    <h2 id="scoring-player-name"></h2>
                    <div class="dart-count">Dart <span id="current-dart-num">1</span> of 3</div>
                </div>

                <div class="current-score" id="running-total">0</div>

                <div class="darts-display">
                    <div class="dart-slot active" id="dart-slot-0">
                        <div class="dart-label">Dart 1</div>
                        <div class="dart-value">-</div>
                    </div>
                    <div class="dart-slot" id="dart-slot-1">
                        <div class="dart-label">Dart 2</div>
                        <div class="dart-value">-</div>
                    </div>
                    <div class="dart-slot" id="dart-slot-2">
                        <div class="dart-label">Dart 3</div>
                        <div class="dart-value">-</div>
                    </div>
                </div>

                <!-- Segment Scoring -->
                <div class="score-section">
                    <h3>Multiplier</h3>
                    <div class="score-grid multipliers">
                        <button class="score-btn multiplier active" data-mult="single" onclick="setMultiplier('single')">Single</button>
                        <button class="score-btn multiplier" data-mult="double" onclick="setMultiplier('double')">Double</button>
                        <button class="score-btn multiplier" data-mult="treble" onclick="setMultiplier('treble')">Treble</button>
                    </div>
                </div>

                <div class="score-section">
                    <h3>Number</h3>
                    <div class="score-grid numbers" id="number-grid"></div>
                </div>

                <div class="score-section">
                    <h3>Special</h3>
                    <div class="score-grid special">
                        <button class="score-btn special-btn" onclick="scoreDart('bull25')">25</button>
                        <button class="score-btn special-btn" onclick="scoreDart('bull50')">Bull (50)</button>
                        <button class="score-btn miss-btn" onclick="scoreDart('miss')">Miss (0)</button>
                    </div>
                </div>

                <div class="or-divider">or enter total manually</div>

                <div class="manual-input-row">
                    <input type="number" id="manual-score" placeholder="Score (0-60)" min="0" max="60" />
                    <button class="btn btn-secondary" onclick="manualDartScore()">Add</button>
                </div>

                <div class="undo-submit-row">
                    <button class="btn btn-secondary" id="btn-undo" onclick="undoLastDart()" disabled>Undo</button>
                    <button class="btn btn-danger btn-small" onclick="cancelTurn()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ STATE ============
        let currentPlayer = '';
        let currentDarts = []; // [{label, score}]
        let currentMultiplier = 'single';

        const STORAGE_KEY = 'junction_darts_data';
        const FIREBASE_URL = 'https://junctiondarts-default-rtdb.firebaseio.com';

        // ============ FIREBASE SYNC ============
        let allThrows = []; // master list synced from Firebase

        async function firebasePush(throwData) {
            try {
                const res = await fetch(FIREBASE_URL + '/throws.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(throwData)
                });
                if (!res.ok) throw new Error('Firebase write failed');
            } catch (e) {
                console.error('Firebase push error:', e);
            }
        }

        async function firebaseLoadAll() {
            try {
                const res = await fetch(FIREBASE_URL + '/throws.json');
                if (!res.ok) throw new Error('Firebase read failed');
                const data = await res.json();
                if (!data) return [];
                return Object.entries(data).map(([key, val]) => ({ ...val, _fbKey: key }));
            } catch (e) {
                console.error('Firebase load error:', e);
                return [];
            }
        }

        async function firebaseClearAll() {
            try {
                await fetch(FIREBASE_URL + '/throws.json', { method: 'DELETE' });
            } catch (e) {
                console.error('Firebase clear error:', e);
            }
        }

        // Poll for updates every 5 seconds
        function startPolling() {
            setInterval(async () => {
                allThrows = await firebaseLoadAll();
                saveLocalBackup(allThrows);
                renderLeaderboard();
                renderHistory();
            }, 5000);
        }

        // ============ LOCAL BACKUP ============
        function saveLocalBackup(throws) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ throws, version: 1 }));
                localStorage.setItem(STORAGE_KEY + '_backup', JSON.stringify({ throws, version: 1 }));
            } catch (e) {
                console.error('LocalStorage backup failed:', e);
            }
        }

        function loadLocalBackup() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return [];
                return JSON.parse(raw).throws || [];
            } catch (e) {
                return [];
            }
        }

        // ============ DATA PERSISTENCE ============
        async function addThrow(playerName, darts, totalScore) {
            const throwData = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                player: playerName,
                darts: darts,
                total: totalScore,
                timestamp: new Date().toISOString()
            };
            // Optimistic: add locally immediately
            allThrows.push(throwData);
            saveLocalBackup(allThrows);
            // Push to Firebase
            await firebasePush(throwData);
        }

        // ============ LEADERBOARD ============
        function getLeaderboard() {
            const best = {};
            allThrows.forEach(t => {
                const name = t.player.toLowerCase().trim();
                if (!best[name] || t.total > best[name].total) {
                    best[name] = t;
                }
            });
            return Object.values(best).sort((a, b) => b.total - a.total);
        }

        function renderLeaderboard() {
            const entries = getLeaderboard();
            const container = document.getElementById('leaderboard-content');

            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No throws yet. Be the first!</p></div>';
                return;
            }

            let html = '<table class="leaderboard-table"><thead><tr><th>#</th><th>Player</th><th>Score</th></tr></thead><tbody>';
            entries.forEach((entry, i) => {
                const dartsStr = entry.darts.map(d => d.label).join(', ');
                html += `<tr>
                    <td class="rank">${i + 1}</td>
                    <td><div class="player-name-cell"><span>${escapeHtml(entry.player)}</span><span class="player-darts">${escapeHtml(dartsStr)}</span></div></td>
                    <td>${entry.total}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderHistory() {
            const container = document.getElementById('history-content');
            const recent = allThrows.slice().reverse().slice(0, 30);

            if (recent.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No throws recorded yet.</p></div>';
                return;
            }

            let html = '';
            recent.forEach(t => {
                const dartsStr = t.darts.map(d => d.label).join(', ');
                const time = new Date(t.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                html += `<div class="history-item">
                    <div>
                        <div class="history-name">${escapeHtml(t.player)}</div>
                        <div class="history-darts">${escapeHtml(dartsStr)}</div>
                        <div class="history-time">${time}</div>
                    </div>
                    <div class="history-score">${t.total}</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // ============ TABS ============
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            if (tab === 'leaderboard') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-leaderboard').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-history').classList.add('active');
            }
        }

        // ============ GAME FLOW ============
        function startTurn() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim();
            if (!name) {
                nameInput.focus();
                return;
            }

            currentPlayer = name;
            currentDarts = [];
            currentMultiplier = 'single';

            document.getElementById('screen-entry').style.display = 'none';
            document.getElementById('screen-scoring').style.display = 'block';
            document.getElementById('scoring-player-name').textContent = name;

            updateScoringUI();
        }

        function cancelTurn() {
            document.getElementById('screen-entry').style.display = 'block';
            document.getElementById('screen-scoring').style.display = 'none';
            currentDarts = [];
        }

        function setMultiplier(mult) {
            currentMultiplier = mult;
            document.querySelectorAll('.score-btn.multiplier').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mult === mult);
            });
        }

        function scoreDart(type) {
            if (currentDarts.length >= 3) return;

            let label, score;

            if (type === 'miss') {
                label = 'Miss';
                score = 0;
            } else if (type === 'bull25') {
                label = '25';
                score = 25;
            } else if (type === 'bull50') {
                label = 'Bull';
                score = 50;
            } else {
                // Number with multiplier
                const num = parseInt(type);
                if (currentMultiplier === 'single') {
                    label = '' + num;
                    score = num;
                } else if (currentMultiplier === 'double') {
                    label = 'D' + num;
                    score = num * 2;
                } else {
                    label = 'T' + num;
                    score = num * 3;
                }
            }

            currentDarts.push({ label, score });
            // Reset multiplier to single after each dart
            setMultiplier('single');
            updateScoringUI();

            if (currentDarts.length === 3) {
                setTimeout(submitTurn, 400);
            }
        }

        function manualDartScore() {
            if (currentDarts.length >= 3) return;
            const input = document.getElementById('manual-score');
            const val = parseInt(input.value);
            if (isNaN(val) || val < 0 || val > 60) {
                input.focus();
                return;
            }
            currentDarts.push({ label: '' + val, score: val });
            input.value = '';
            updateScoringUI();

            if (currentDarts.length === 3) {
                setTimeout(submitTurn, 400);
            }
        }

        function undoLastDart() {
            if (currentDarts.length > 0) {
                currentDarts.pop();
                updateScoringUI();
            }
        }

        function submitTurn() {
            const total = currentDarts.reduce((sum, d) => sum + d.score, 0);
            addThrow(currentPlayer, currentDarts, total);

            document.getElementById('screen-entry').style.display = 'block';
            document.getElementById('screen-scoring').style.display = 'none';

            currentDarts = [];
            renderLeaderboard();
            renderHistory();
        }

        function updateScoringUI() {
            const total = currentDarts.reduce((sum, d) => sum + d.score, 0);
            document.getElementById('running-total').textContent = total;
            document.getElementById('current-dart-num').textContent = Math.min(currentDarts.length + 1, 3);
            document.getElementById('btn-undo').disabled = currentDarts.length === 0;

            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById('dart-slot-' + i);
                const val = slot.querySelector('.dart-value');
                slot.classList.remove('active', 'filled');

                if (i < currentDarts.length) {
                    val.textContent = currentDarts[i].label;
                    slot.classList.add('filled');
                } else if (i === currentDarts.length) {
                    val.textContent = '-';
                    slot.classList.add('active');
                } else {
                    val.textContent = '-';
                }
            }
        }

        // ============ NUMBER GRID ============
        function buildNumberGrid() {
            const grid = document.getElementById('number-grid');
            for (let i = 1; i <= 20; i++) {
                const btn = document.createElement('button');
                btn.className = 'score-btn';
                btn.textContent = i;
                btn.onclick = () => scoreDart('' + i);
                grid.appendChild(btn);
            }
        }

        // ============ UTILS ============
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function clearData() {
            if (confirm('Are you sure you want to clear ALL data? This cannot be undone.')) {
                await firebaseClearAll();
                allThrows = [];
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(STORAGE_KEY + '_backup');
                renderLeaderboard();
                renderHistory();
            }
        }

        function exportData() {
            const data = { throws: allThrows, version: 1 };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'junction_darts_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Enter key starts turn
        document.getElementById('player-name').addEventListener('keydown', e => {
            if (e.key === 'Enter') startTurn();
        });

        // Manual score enter key
        document.getElementById('manual-score').addEventListener('keydown', e => {
            if (e.key === 'Enter') manualDartScore();
        });

        // ============ AURORA BOREALIS ============
        (function initAurora() {
            const canvas = document.getElementById('aurora-canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resize();
            window.addEventListener('resize', resize);

            const vertSrc = `
                attribute vec2 position;
                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            const fragSrc = `
                precision mediump float;
                uniform float u_time;
                uniform vec2 u_resolution;

                // Simplex-like noise
                vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
                vec2 mod289(vec2 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
                vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

                float snoise(vec2 v) {
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                                       -0.577350269189626, 0.024390243902439);
                    vec2 i  = floor(v + dot(v, C.yy));
                    vec2 x0 = v - i + dot(i, C.xx);
                    vec2 i1;
                    i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod289(i);
                    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                    m = m*m;
                    m = m*m;
                    vec3 x_ = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x_) - 0.5;
                    vec3 ox = floor(x_ + 0.5);
                    vec3 a0 = x_ - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
                    vec3 g;
                    g.x  = a0.x  * x0.x  + h.x  * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }

                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution;
                    float t = u_time * 0.15;

                    // Create flowing aurora bands
                    float y = uv.y;

                    // Multiple noise layers for 3D depth effect
                    float n1 = snoise(vec2(uv.x * 2.0 + t, y * 1.5 + t * 0.3)) * 0.5 + 0.5;
                    float n2 = snoise(vec2(uv.x * 3.0 - t * 0.7, y * 2.0 + t * 0.2)) * 0.5 + 0.5;
                    float n3 = snoise(vec2(uv.x * 1.5 + t * 0.5, y * 3.0 - t * 0.4)) * 0.5 + 0.5;

                    // Aurora band positions (upper portion of screen)
                    float band1 = smoothstep(0.0, 0.15, exp(-pow((y - 0.7 - n1 * 0.15) * 5.0, 2.0)));
                    float band2 = smoothstep(0.0, 0.12, exp(-pow((y - 0.6 - n2 * 0.12) * 6.0, 2.0)));
                    float band3 = smoothstep(0.0, 0.1, exp(-pow((y - 0.8 - n3 * 0.1) * 7.0, 2.0)));

                    // Aurora colors - greens, teals, purples
                    vec3 col1 = vec3(0.1, 0.8, 0.4); // green
                    vec3 col2 = vec3(0.1, 0.5, 0.8); // teal
                    vec3 col3 = vec3(0.5, 0.2, 0.8); // purple

                    vec3 aurora = band1 * col1 * n1 + band2 * col2 * n2 + band3 * col3 * n3;

                    // Add subtle vertical streaks for 3D curtain effect
                    float streak = snoise(vec2(uv.x * 8.0 + t * 0.3, uv.y * 0.5)) * 0.5 + 0.5;
                    aurora *= 0.7 + streak * 0.5;

                    // Depth fog / glow at base
                    float glow = exp(-pow((y - 0.3) * 2.0, 2.0)) * 0.03;
                    aurora += vec3(0.1, 0.3, 0.2) * glow;

                    // Keep it subtle - multiply down
                    aurora *= 0.35;

                    // Dark background with aurora
                    vec3 bg = vec3(0.0, 0.0, 0.02);
                    vec3 finalColor = bg + aurora;

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `;

            function compileShader(src, type) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, src);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error(gl.getShaderInfoLog(shader));
                    return null;
                }
                return shader;
            }

            const vert = compileShader(vertSrc, gl.VERTEX_SHADER);
            const frag = compileShader(fragSrc, gl.FRAGMENT_SHADER);
            const program = gl.createProgram();
            gl.attachShader(program, vert);
            gl.attachShader(program, frag);
            gl.linkProgram(program);
            gl.useProgram(program);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

            const pos = gl.getAttribLocation(program, 'position');
            gl.enableVertexAttribArray(pos);
            gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

            const uTime = gl.getUniformLocation(program, 'u_time');
            const uRes = gl.getUniformLocation(program, 'u_resolution');

            function render(t) {
                gl.uniform1f(uTime, t * 0.001);
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        })();

        // ============ INIT ============
        buildNumberGrid();
        // Load local backup first for instant display
        allThrows = loadLocalBackup();
        renderLeaderboard();
        renderHistory();
        // Then sync from Firebase and start polling
        (async () => {
            const remote = await firebaseLoadAll();
            if (remote.length > 0) {
                allThrows = remote;
                saveLocalBackup(allThrows);
            }
            renderLeaderboard();
            renderHistory();
            startPolling();
        })();
    </script>
</body>
